name: Build derived data and deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "metadata/**"
      - "data/toc/**"
      - "schema/**"
      - "scripts/**"
      - "docs/index.html"
      - "docs/style.css"
      - "docs/app.js"
      - "requirements.txt"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: 依存パッケージを導入
        run: pip install -r requirements.txt

      - name: データ版の更新を確認
        run: python scripts/check_version_update.py

      - name: JSON・CSVを全件再生成
        run: python scripts/build_derived_data.py

      - name: 生成物を検査
        run: python scripts/check_generated_files.py

      - name: 生成物をリポジトリへ反映
        run: |
          if git diff --quiet -- docs/data; then
            echo "生成物に変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "build: regenerate CSV and JSON for the current YAML version"
          git pull --rebase origin main
          git push

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: GitHub Pages用ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
